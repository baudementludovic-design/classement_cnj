<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNJ 2026 · Classements jeunes FFPJP</title><meta name="description" content="Les joueurs des classements CNJ 2026 : Minimes, Cadets et Juniors, avec leurs résultats détaillés."><style>
:root{
  --bg:#eef2f8; --surface:#ffffff; --ink:#14244a; --muted:#56637d; --line:#d6deeb;
  --accent:#204b9c; --accent-soft:#e2e9f6; --red:#e30613;
  --gold:#b98a14; --gold-bg:#fbf1d3;
  --silver:#6b7684; --silver-bg:#e9edf1;
  --bronze:#a3592b; --bronze-bg:#f6e4d8;
  --quart:#3d6b5a; --quart-bg:#e2efe9;
  --warn-bg:#fff4dc; --warn-ink:#7a5410;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1424; --surface:#16203a; --ink:#e6ebf4; --muted:#9ba8c0; --line:#28355a;
    --accent:#8aaaf0; --accent-soft:#1c2b52; --red:#ff5a5f;
    --gold:#e2b848; --gold-bg:#3a3118; --silver:#b8c2cf; --silver-bg:#2a323e;
    --bronze:#e0976a; --bronze-bg:#3b2a20; --quart:#8cc7ae; --quart-bg:#1e3129;
    --warn-bg:#3a2f16; --warn-ink:#f0cf86;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1424; --surface:#16203a; --ink:#e6ebf4; --muted:#9ba8c0; --line:#28355a;
  --accent:#8aaaf0; --accent-soft:#1c2b52; --red:#ff5a5f;
  --gold:#e2b848; --gold-bg:#3a3118; --silver:#b8c2cf; --silver-bg:#2a323e;
  --bronze:#e0976a; --bronze-bg:#3b2a20; --quart:#8cc7ae; --quart-bg:#1e3129;
  --warn-bg:#3a2f16; --warn-ink:#f0cf86;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
h1,h2,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:3px solid var(--accent);padding-bottom:14px;position:relative}
header.top::after{content:"";position:absolute;left:0;bottom:-7px;width:72px;height:3px;background:var(--red)}
.brand{display:flex;align-items:center;gap:16px;flex:1 1 auto}
.brand-text{flex:1;text-align:center}
.logos{display:flex;align-items:center;gap:8px;flex-shrink:0}
.logos img{height:96px;width:auto}
.eyebrow{color:var(--red)!important}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(30px,6vw,46px);line-height:1;margin:4px 0 0;font-weight:700;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;color:var(--accent)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}
.status[hidden]{display:none}
.status.snap{background:var(--warn-bg);color:var(--warn-ink)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 10px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px}
.V{--c:var(--gold);--cb:var(--gold-bg)} .F{--c:var(--silver);--cb:var(--silver-bg)}
.D{--c:var(--bronze);--cb:var(--bronze-bg)} .Q{--c:var(--quart);--cb:var(--quart-bg)}
.dot{background:var(--c)}

/* Fiches */
.list{display:flex;flex-direction:column;gap:10px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:56px 1fr auto auto;gap:4px 14px;align-items:center}
.rank{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;text-align:center}
.player.top3 .rank{color:var(--gold)}
.who .name{font-weight:700;font-size:17px}
.who .club{color:var(--muted);font-size:13px}
.pts{text-align:right;font-family:"Barlow Condensed",sans-serif;line-height:1}
.pts b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.pts small{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:"Source Sans 3",sans-serif}
.toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.toggle:hover{color:var(--accent);border-color:var(--accent)}
.toggle svg{width:16px;height:16px;transition:transform .2s}
.toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){.toggle svg{transition:none}}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--cb);color:var(--c);font-variant-numeric:tabular-nums}
.results{grid-column:2/-1;margin:12px 0 2px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 22px;padding-top:12px;border-top:1px solid var(--line)}
.results[hidden]{display:none}
.col h3{margin:0 0 6px;font:700 13px/1.2 "Source Sans 3",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--c);display:flex;justify-content:space-between;gap:8px;padding-bottom:5px;border-bottom:2px solid var(--c)}
.col h3 span{font-variant-numeric:tabular-nums}
.col ul{list-style:none;margin:0;padding:0}
.col li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.col li .p{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.col .none{color:var(--muted);font-size:14px}
.col li .ast{color:var(--accent);margin-right:1px}
.results .note{grid-column:1/-1;margin:0;font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}

footer{margin-top:22px;font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .player{grid-template-columns:40px 1fr auto auto;gap:4px 10px;padding:12px}
  .rank{font-size:26px}
  .results{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}
  .logos img{height:64px}
  .brand{gap:12px}
  .meta{align-items:flex-start}
}

:root{--accent:#16458b}body{background:radial-gradient(ellipse at top left,#dfe8f7,transparent 60%),var(--bg)}.wrap{max-width:1180px;padding-top:24px}header.top{background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--accent);border-radius:20px;padding:26px;box-shadow:0 10px 35px #12244a08}header.top:after{bottom:-4px;left:26px;width:100px;height:4px}.brand-text{text-align:left}.eyebrow{font-weight:700}h1{font-size:clamp(30px,5vw,48px)}.intro{color:var(--muted);margin:10px 0 0}.logos img{height:82px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0 18px}.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:15px 10px;cursor:pointer;font:700 18px 'Source Sans 3',sans-serif;text-align:left}.tab small{display:block;font-size:12px;font-weight:400;margin-top:3px}.tab[aria-pressed=true]{background:var(--accent);color:var(--surface);border-color:var(--accent)}.controls{gap:10px}.action,select{font:600 14px 'Source Sans 3',sans-serif;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:9px;cursor:pointer}.search input{padding:13px 14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 14px}.section-head h2{font-size:28px;margin:0}.section-meta{text-align:right;color:var(--muted);font-size:12px}.section-meta .status{margin-bottom:4px}.player{border-radius:13px;transition:border-color .18s,box-shadow .18s}.player:hover{border-color:var(--accent);box-shadow:0 4px 16px #12244a0a}.player.top3{border-left:4px solid var(--gold)}.who{min-width:0}.who .name,.who .club{overflow-wrap:anywhere}.player:nth-child(2).top3{border-left-color:var(--silver)}.player:nth-child(3).top3{border-left-color:var(--bronze)}.player:nth-child(2).top3 .rank{color:var(--silver)}.player:nth-child(3).top3 .rank{color:var(--bronze)}.count{color:var(--muted);font-size:13px;margin:10px 0}footer{border-top:1px solid var(--line);padding-top:18px;display:flex;justify-content:space-between;gap:12px}.legend{margin-top:18px}.status.loading{opacity:.75}button:disabled{opacity:.55;cursor:wait}.back{position:fixed;bottom:18px;right:18px;border-radius:50%;background:var(--accent);color:var(--surface);border:0;width:42px;height:42px;cursor:pointer;font-size:20px}[hidden]{display:none!important}
@media(max-width:650px){header.top{padding:20px}.brand{flex-direction:column;align-items:flex-start}.brand-text{text-align:left}.logos img{height:65px}.tabs{grid-template-columns:repeat(3,1fr)}.tab{font-size:16px}.controls .search{flex-basis:100%}.action{flex:1}.section-head{align-items:flex-start}.section-meta{max-width:155px}.wrap{padding-inline:12px}.results{gap:16px 12px}.col li{font-size:12px}.who .name{font-size:15px}.pts b{font-size:26px}footer{flex-direction:column}}
@media print{.tabs,.controls,.legend,.back{display:none}body{background:white}.wrap{max-width:none}.player{break-inside:avoid;box-shadow:none}header.top{box-shadow:none}.results[hidden]{display:none}.section-head{break-after:avoid}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- Lecture CSV ---------- */
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){ r.push(f); f="" }
    else if(c=='\n'){ r.push(f.replace(/\r$/,"")); rows.push(r); r=[]; f="" }
    else f+=c;
  }
  r.push(f); rows.push(r); return rows;
}
const isLic = s => /^\d{6,}$/.test((s||"").trim());
function stage(label){
  const s=(label||"").toLowerCase();
  if(/¼|1\/4|quart/.test(s)) return "Q";
  if(/½|1\/2|demi/.test(s)) return "D";
  if(/final/.test(s)) return "F";
  if(/vainq|champ/.test(s)) return "V";
  return null;
}
async function getCSV(gid,signal){
  for(let k=0;k<3;k++){
    const r=await fetch(SHEET(gid),{signal});
    const t=r.ok?await r.text():"";
    if(t && !/^\s*<!DOCTYPE|^\s*<html/i.test(t)) return parseCSV(t);
    await new Promise(res=>setTimeout(res,800*(k+1)));
  }
  throw new Error("Onglet "+gid+" illisible");
}
/* Limite le nombre de requêtes simultanées (Google refuse les rafales) */
async function pool(items,n,fn){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:n},async()=>{ while(i<items.length){ const k=i++; out[k]=await fn(items[k]); } }));
  return out;
}

/* ---------- Lecture d'un onglet compétition ----------
   Modèle de la feuille : ¼ lignes 2-13, ½ lignes 15-20, finale 22-24, vainqueurs 26-28.
   Colonne A licence, C club, E n° d'équipe (1re ligne de l'équipe), G points,
   H = 1 sur la dernière ligne de l'équipe si l'équipe est homogène club (bonus de 2 points). */
const POS={0:"Q",13:"D",20:"F",24:"V",28:null};
function parseComp(rows){
  let title=""; rows.forEach(r=>r.forEach(c=>{ if(!title && /NATIONAL/i.test(c)) title=c.split("\n").pop().trim(); }));
  title=title.replace(/^.*?(NATIONAL)/i,"$1");
  const out=[]; let sec=null, team=[];
  const flush=()=>{ if(!team.length) return;
    const h=(team[team.length-1].r[7]||"").trim()==="1";
    team.forEach(t=>out.push({lic:t.lic,s:t.s,pts:t.pts,h,club:t.club})); team=[]; };
  rows.slice(0,50).forEach((r,i)=>{
    if(i in POS){ flush(); sec=POS[i]; }
    const a=(r[0]||"").trim();
    if(a && !isLic(a)){ flush(); const st=stage(a); if(st) sec=st; return; }
    if(!isLic(a) || !sec){ flush(); return; }
    if((r[4]||"").trim()) flush();
    team.push({lic:a,s:sec,pts:parseFloat((r[6]||"").replace(",","."))||0,
      club:(r[2]||"").replace(/^\d+\//,"").replace(/\s*\/\s*\d+$/,"").trim(),r});
  });
  flush();
  return {title,out};
}

/* ---------- Chargement en direct ---------- */
async function loadLive(){
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),25000);
  try{
    const cl=await getCSV(GID_CLASSEMENT,ctrl.signal);
    const tabs=await pool(COMPETITIONS,4,([,g])=>getCSV(g,ctrl.signal));
    const maj=(cl.flat().join(" ").match(/MAJ\s*([\d./]+)/)||[])[1]||"";
    const titles={}, byLic={}, clubs={};
    tabs.forEach((rows,i)=>{
      const key=COMPETITIONS[i][0];
      const {title,out}=parseComp(rows);
      titles[key]=title||key;
      out.forEach(e=>{
        const m=(byLic[e.lic]=byLic[e.lic]||{});
        if(!m[key] || m[key].pts<e.pts) m[key]={s:e.s,pts:e.pts,h:e.h};  // dédoublonnage
        if(e.club) clubs[e.lic]=e.club;
      });
    });
    const players=[];
    for(const r of cl){
      if(!isLic(r[0])) continue;
      const lic=r[0].trim(), m=byLic[lic]||{};
      players.push({lic,rank:+r[1],dep:(r[2]||"").trim(),name:(r[3]||"").trim(),pts:+r[4]||0,club:clubs[lic]||"",
        res:COMPETITIONS.map(([k])=>k).filter(k=>m[k]).map(k=>({c:k,s:m[k].s,pts:m[k].pts,h:m[k].h}))});
      if(players.length>=TOP_N) break;
    }
    if(!players.length) throw new Error("Classement vide");
    return {live:true,maj,titles,players};
  } finally { clearTimeout(timer); }
}
function loadSnapshot(){
  const players=SNAPSHOT.trim().split("\n").map(l=>{
    const [lic,rank,dep,name,pts,club,res]=l.split("|");
    return {lic,rank:+rank,dep,name,pts:+pts,club,res:res.split(",").map(x=>{const [c,v]=x.split(":");return {c,s:v[0],pts:parseFloat(v.slice(1)),h:v.endsWith("*")}})};
  });
  return {live:false,maj:SNAPSHOT_MAJ,titles:SNAPSHOT_TITLES,players};
}

/* ---------- Lecture CSV ---------- */
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){ r.push(f); f="" }
    else if(c=='\n'){ r.push(f.replace(/\r$/,"")); rows.push(r); r=[]; f="" }
    else f+=c;
  }
  r.push(f); rows.push(r); return rows;
}
const isLic = s => /^\d{6,}$/.test((s||"").trim());
function stage(label){
  const s=(label||"").toLowerCase();
  if(/¼|1\/4|quart/.test(s)) return "Q";
  if(/½|1\/2|demi/.test(s)) return "D";
  if(/final/.test(s)) return "F";
  if(/vainq|champ/.test(s)) return "V";
  return null;
}
async function getCSV(gid,signal){
  const r=await fetch(SHEET+gid,{signal});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseCSV(await r.text());
}

/* ---------- Cellules surlignées en bleu (équipe homogène) ---------- */
const SHEET_HTML = SHEET.replace("pub?output=csv&single=true&gid=","pubhtml/sheet?headers=false&gid=");
function isLightBlue(col){
  col=(col||"").trim().toLowerCase(); let r,g,b,m;
  if((m=col.match(/^#([0-9a-f]{6})$/))){ r=parseInt(m[1].slice(0,2),16); g=parseInt(m[1].slice(2,4),16); b=parseInt(m[1].slice(4,6),16); }
  else if((m=col.match(/^#([0-9a-f]{3})$/))){ [r,g,b]=[...m[1]].map(h=>parseInt(h+h,16)); }
  else if((m=col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/))){ [r,g,b]=[+m[1],+m[2],+m[3]]; }
  else return false;
  return b>=180 && b-r>=40 && (r+g+b)/3>=150;
}
async function getHomogeneous(gid,signal){
  try{
    const r=await fetch(SHEET_HTML+gid,{signal}); if(!r.ok) return new Set();
    const html=await r.text();
    const css=[...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m=>m[1]).join("\n");
    const blue=new Set();
    for(const m of css.matchAll(/\.(s\d+)\s*\{([^}]*)\}/g)){ const bg=(m[2].match(/background-color:\s*([^;]+)/)||[])[1]; if(isLightBlue(bg)) blue.add(m[1]); }
    const out=new Set(); if(!blue.size) return out;
    const doc=new DOMParser().parseFromString(html,"text/html");
    for(const tr of doc.querySelectorAll("table.waffle tbody tr")){
      const tds=[...tr.querySelectorAll("td")];
      const lic=tds.map(td=>td.textContent.trim()).find(isLic); if(!lic) continue;
      if(tds.some(td=>/^\d+([.,]\d+)?$/.test(td.textContent.trim()) && [...td.classList].some(c=>blue.has(c)))) out.add(lic);
    }
    return out;
  }catch(e){ return new Set(); }
}

    }

    return {live:true,maj,titles,players};
  } finally { clearTimeout(timer); }
}

}

/* ---------- Lecture CSV ---------- */
function parseCSV(t){
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){ r.push(f); f="" }
    else if(c=='\n'){ r.push(f.replace(/\r$/,"")); rows.push(r); r=[]; f="" }
    else f+=c;
  }
  r.push(f); rows.push(r); return rows;
}
const isLic = s => /^\d{6,}$/.test((s||"").trim());
function stage(label){
  const s=(label||"").toLowerCase();
  if(/¼|1\/4|quart/.test(s)) return "Q";
  if(/½|1\/2|demi/.test(s)) return "D";
  if(/final/.test(s)) return "F";
  if(/vainq|champ/.test(s)) return "V";
  return null;
}
const num = s => parseFloat((s||"").replace(",","."))||0;
const cleanClub = c => c.replace(/^\d+\//,"").replace(/\/\d*$/,"").replace(/\s+/g," ").trim();
/* Lecture d'un onglet compétition : tableau « Résultats Juniors » (colonnes N° de licence … Point classement),
   sinon bloc de gauche (Perdants ¼ / Demi / Finalistes / Vainqueurs). */
function parseTab(rows){
  const out=[]; let L=-1, start=-1;
  rows.forEach((r,j)=>{ if(L<0){ const i=r.findIndex(c=>/licence/i.test(c)); if(i>=0){L=i;start=j;} } });
  if(L>=0){
    let sec=null;
    for(const r of rows.slice(start+1)){
      const lab=(r[L+4]||"").trim(); if(lab) sec=stage(lab);
      const lic=(r[L]||"").trim();
      if(isLic(lic) && sec) out.push({lic,s:sec,pts:num(r[L+5]),club:r[L+2]||""});
    }
  }
  if(!out.length){
    let sec=null;
    for(const r of rows.slice(0,50)){
      const a=(r[0]||"").trim();
      if(a && !isLic(a) && !(r[1]||"").trim()){ sec=stage(a); continue; }
      if(isLic(a) && sec) out.push({lic:a,s:sec,pts:num(r[6]),club:r[2]||""});
    }
  }
  return out;
}
async function getCSV(gid,signal){
  const r=await fetch(SHEET+gid,{signal});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return parseCSV(await r.text());
}

/* ---------- Cellules surlignées en bleu (équipe homogène) ---------- */
const SHEET_HTML = SHEET.replace("pub?output=csv&single=true&gid=","pubhtml/sheet?headers=false&gid=");
function isLightBlue(col){
  col=(col||"").trim().toLowerCase(); let r,g,b,m;
  if((m=col.match(/^#([0-9a-f]{6})$/))){ r=parseInt(m[1].slice(0,2),16); g=parseInt(m[1].slice(2,4),16); b=parseInt(m[1].slice(4,6),16); }
  else if((m=col.match(/^#([0-9a-f]{3})$/))){ [r,g,b]=[...m[1]].map(h=>parseInt(h+h,16)); }
  else if((m=col.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/))){ [r,g,b]=[+m[1],+m[2],+m[3]]; }
  else return false;
  return b>=180 && b-r>=40 && (r+g+b)/3>=150;
}
async function getHomogeneous(gid,signal){
  try{
    const r=await fetch(SHEET_HTML+gid,{signal}); if(!r.ok) return new Set();
    const html=await r.text();
    const css=[...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m=>m[1]).join("\n");
    const blue=new Set();
    for(const m of css.matchAll(/\.(s\d+)\s*\{([^}]*)\}/g)){ const bg=(m[2].match(/background-color:\s*([^;]+)/)||[])[1]; if(isLightBlue(bg)) blue.add(m[1]); }
    const out=new Set(); if(!blue.size) return out;
    const doc=new DOMParser().parseFromString(html,"text/html");
    for(const tr of doc.querySelectorAll("table.waffle tbody tr")){
      const tds=[...tr.querySelectorAll("td")];
      const lic=tds.map(td=>td.textContent.trim()).find(isLic); if(!lic) continue;
      if(tds.some(td=>/^\d+([.,]\d+)?$/.test(td.textContent.trim()) && [...td.classList].some(c=>blue.has(c)))) out.add(lic);
    }
    return out;
  }catch(e){ return new Set(); }
}

async function loadLive(){

      titles[key]=title||key;

        if(x.club) clubs[x.lic]=cleanClub(x.club);
      }
    });
    const players=[];
    for(const r of cl){

      players.push({lic,rank:+r[1],dep:(r[2]||"").trim(),name:(r[3]||"").trim(),pts:+r[4]||0,club:clubs[lic]||"",
        res:COMPETITIONS.map(([k],i)=>[k,i]).filter(([k])=>m[k]).map(([k,i])=>({c:k,s:m[k].s,pts:m[k].pts,h:homog[i].has(lic)}))});
      if(players.length>=TOP_N) break;
    }
    if(!players.length) throw new Error("Classement vide");
    return {live:true,maj,titles,players};
  } finally { clearTimeout(timer); }
}
function loadSnapshot(){

    return {lic,rank:+rank,dep,name,pts:+pts,club,res:res.split(",").map(x=>{const [c,v]=x.split(":");return {c,s:v[0],pts:parseFloat(v.slice(1)),h:v.endsWith("*")}})};

return {loadSnapshot,loadLive};})()];
const NAMES=['Minimes','Cadets','Juniors'];
const DATA=LOADERS.map(l=>l.loadSnapshot());const OPEN=new Set();let active='0';
const LABELS={V:'Vainqueur',F:'Finaliste',D:'Demi-finaliste',Q:'Quart de finaliste'};
const STAGE_ORDER={V:0,F:1,D:2,Q:3};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function shortName(title,key){return (title||key).replace(/^.*NATIONAL\s+JEUNE\s+(DE\s+|D')/i,'').trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(Sur|En|Du)\b/g,w=>w.toLowerCase());}
function renderFiches(list,DATA,key){
  if(!list.length) return '<div class="empty">Aucun joueur ne correspond à cette recherche.</div>';
  return '<div class="list">'+list.map(p=>{
    const sorted=p.res.map((r,i)=>({...r,i})).sort((x,y)=>STAGE_ORDER[x.s]-STAGE_ORDER[y.s]||x.i-y.i);
    const open=OPEN.has(key+":"+p.lic);
    const res=["V","F","D","Q"].map(k=>{const items=sorted.filter(r=>r.s===k);
      return `<div class="col ${k}"><h3>${LABELS[k]}</h3>`+(items.length?`<ul>`+items.map(r=>`<li title="${esc(DATA.titles[r.c]||r.c)}"><span>${esc(shortName(DATA.titles[r.c],r.c))}</span><span class="p">${r.h?'<span class="ast">*</span>':''}${r.pts}</span></li>`).join("")+`</ul>`:`<div class="none">—</div>`)+`</div>`;}).join("")
      +'<p class="note">* Bonus de 2 points pour homogénéité club</p>';
    return `<article id="player-${key}-${esc(p.lic)}" tabindex="-1" class="player${p.rank<=3?" top3":""}">
      <div class="rank">${p.rank}</div>
      <div class="who"><div class="name">${esc(p.name)}${nameMatch(p)?` <button class="action player-go" data-go-key="${key}" data-go-lic="${esc(p.lic)}" aria-label="Aller à la fiche de ${esc(p.name)}">Go</button>`:""}</div><div class="club">${esc(p.club)}${p.club?" · ":""}${/^\d/.test(p.dep)?"Dép. ":""}${esc(p.dep)}</div></div>
      <div class="pts"><b>${p.pts}</b><small>pts</small></div>
      <button class="toggle" type="button" data-key="${key}" data-lic="${esc(p.lic)}" aria-expanded="${open}" aria-controls="r-${key}-${esc(p.lic)}" aria-label="Voir les résultats de ${esc(p.name)}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></button>
      <div class="results" id="r-${key}-${esc(p.lic)}"${open?"":" hidden"}>${res}</div>
    </article>`;}).join("")+'</div>';
}
function queryTokens(){return norm(document.getElementById('q').value.trim()).split(/\s+/).filter(Boolean);}
function nameMatch(p){const tokens=queryTokens();return tokens.length>0&&tokens.every(t=>norm(p.name).includes(t));}
function nameMatches(){return DATA.flatMap((d,key)=>d.players.filter(nameMatch).map(p=>({key,p})));}
function shown(){const tokens=queryTokens();return DATA.map((d,key)=>({key,d,list:d.players.filter(p=>tokens.every(t=>norm(p.name+' '+p.club+' '+p.dep).includes(t)))})).filter(x=>tokens.length?x.list.length:String(x.key)===active);}
function render(){const sections=shown();let count=0;document.getElementById('out').innerHTML=sections.map(({key,d,list})=>{count+=list.length;return `<section aria-labelledby="cat-${key}"><div class="section-head"><h2 id="cat-${key}">${NAMES[key]} <span style="font-size:16px;color:var(--muted)">· Top ${d.players.length}</span></h2></div>${renderFiches(list,d,key)}</section>`}).join('')||'<div class="empty">Aucun joueur ne correspond à cette recherche.</div>';document.getElementById('count').textContent=(queryTokens().length&&count?'Catégories : '+sections.map(x=>NAMES[x.key]).join(', '):'');const all=sections.flatMap(x=>x.list.map(p=>x.key+':'+p.lic));document.getElementById('expand').textContent=all.length&&all.every(k=>OPEN.has(k))?'Tout replier':'Tout déplier';document.getElementById('go').hidden=!nameMatches().length;document.querySelectorAll('[data-cat]').forEach(t=>{const selected=queryTokens().length?sections.some(x=>String(x.key)===t.dataset.cat):t.dataset.cat===active;t.setAttribute('aria-pressed',String(selected));});}
function goToPlayer(key,lic){active=String(key);document.getElementById('q').value='';OPEN.add(key+':'+lic);render();const card=document.getElementById('player-'+key+'-'+lic);if(card){card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});card.focus({preventScroll:true});}}
function goSearch(){const matches=nameMatches();if(matches.length===1){goToPlayer(matches[0].key,matches[0].p.lic);}else if(matches.length){document.getElementById('count').textContent+=' · Plusieurs joueurs correspondent : choisissez le bouton Go à côté du nom.';document.querySelector('.player-go')?.focus();}}
document.getElementById('go').onclick=goSearch;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();goSearch();}});
document.getElementById('out').addEventListener('click',e=>{const b=e.target.closest('[data-go-key]');if(b)goToPlayer(b.dataset.goKey,b.dataset.goLic);});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;active=b.dataset.cat;document.getElementById('q').value='';document.querySelectorAll('[data-cat]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render();});
document.getElementById('q').addEventListener('input',render);
document.getElementById('out').addEventListener('click',e=>{const b=e.target.closest('.toggle');if(!b)return;const key=b.dataset.key+':'+b.dataset.lic;OPEN.has(key)?OPEN.delete(key):OPEN.add(key);const isOpen=OPEN.has(key);b.setAttribute('aria-expanded',String(isOpen));document.getElementById('r-'+b.dataset.key+'-'+b.dataset.lic).hidden=!isOpen;const all=shown().flatMap(x=>x.list.map(p=>x.key+':'+p.lic));document.getElementById('expand').textContent=all.length&&all.every(k=>OPEN.has(k))?'Tout replier':'Tout déplier';});
document.getElementById('expand').onclick=()=>{const keys=shown().flatMap(x=>x.list.map(p=>x.key+':'+p.lic));const close=keys.every(k=>OPEN.has(k));keys.forEach(k=>close?OPEN.delete(k):OPEN.add(k));render();};
document.getElementById('print').onclick=()=>window.print();render();
